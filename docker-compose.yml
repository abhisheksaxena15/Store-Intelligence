version: "3.9"

services:
  # ── Intelligence API ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: store_intelligence_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # SQLite database + event files persist here
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/store_intelligence.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Live Dashboard ────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: store_intelligence_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - STORE_IDS=STORE_BLR_002,STORE_BLR_003,STORE_MUM_001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data: